<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مولّد الصور بالذكاء الاصطناعي</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #050508; --surface: #0d0d18; --card: #12121f;
      --border: #1e1e35; --accent: #7c5cfc; --accent2: #fc5c9c;
      --text: #e8e8f5; --muted: #6b6b8a;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--bg); color: var(--text); font-family: 'Cairo', sans-serif; min-height: 100vh; }
    body::before {
      content: ''; position: fixed; inset: 0;
      background: radial-gradient(ellipse 60% 40% at 20% 20%, rgba(124,92,252,0.12) 0%, transparent 70%),
                  radial-gradient(ellipse 50% 40% at 80% 80%, rgba(252,92,156,0.10) 0%, transparent 70%);
      pointer-events: none; z-index: 0;
    }
    .container { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 0 24px; }
    header { padding: 40px 0 20px; text-align: center; }
    .logo-badge { display: inline-flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--border); border-radius: 100px; padding: 8px 20px; margin-bottom: 28px; font-size: 13px; color: var(--muted); }
    .logo-dot { width: 8px; height: 8px; background: var(--accent); border-radius: 50%; box-shadow: 0 0 10px var(--accent); animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.6;transform:scale(0.85)} }
    h1 { font-size: clamp(2.2rem, 6vw, 4rem); font-weight: 900; background: linear-gradient(135deg, #fff 30%, var(--accent) 60%, var(--accent2) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 14px; }
    .subtitle { color: var(--muted); font-size: 1.05rem; margin-bottom: 48px; }
    .main-card { background: var(--card); border: 1px solid var(--border); border-radius: 24px; padding: 36px; margin-bottom: 32px; position: relative; overflow: hidden; }
    .main-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--accent), var(--accent2), transparent); }
    label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 8px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
    textarea { width: 100%; background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: 16px; padding: 18px 20px; font-family: 'Cairo', sans-serif; font-size: 15px; resize: none; outline: none; transition: border-color 0.25s; line-height: 1.7; min-height: 120px; margin-bottom: 20px; }
    textarea:focus { border-color: var(--accent); }
    textarea::placeholder { color: var(--muted); }
    .settings-row { display: flex; gap: 14px; margin-bottom: 24px; flex-wrap: wrap; }
    .setting-group { flex: 1; min-width: 150px; }
    select { width: 100%; background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: 12px; padding: 10px 14px; font-family: 'Cairo', sans-serif; font-size: 14px; cursor: pointer; outline: none; appearance: none; }
    select:focus { border-color: var(--accent); }
    .suggested { margin-bottom: 20px; }
    .sug-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .sug-chip { background: rgba(92,248,252,0.06); border: 1px solid rgba(92,248,252,0.15); color: #5cf8fc; border-radius: 100px; padding: 6px 14px; font-size: 12px; cursor: pointer; transition: all 0.2s; font-family: 'Cairo', sans-serif; }
    .sug-chip:hover { background: rgba(92,248,252,0.15); }
    .generate-btn { width: 100%; padding: 18px; background: linear-gradient(135deg, var(--accent), var(--accent2)); border: none; border-radius: 16px; color: #fff; font-family: 'Cairo', sans-serif; font-size: 17px; font-weight: 700; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; box-shadow: 0 4px 24px rgba(124,92,252,0.4); }
    .generate-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(124,92,252,0.55); }
    .generate-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .btn-inner { display: flex; align-items: center; justify-content: center; gap: 10px; }
    .spinner { width: 20px; height: 20px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-box { background: rgba(252,92,92,0.1); border: 1px solid rgba(252,92,92,0.3); border-radius: 14px; padding: 16px 20px; color: #fc9c9c; font-size: 14px; margin-bottom: 20px; display: none; }
    .image-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
    .image-card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; overflow: hidden; transition: transform 0.25s; animation: fadeUp 0.5s ease both; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(24px)} to{opacity:1;transform:translateY(0)} }
    .image-card:hover { transform: translateY(-4px); }
    .image-card img { width: 100%; display: block; aspect-ratio: 1; object-fit: cover; }
    .image-card-footer { padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--border); }
    .image-prompt-text { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; margin-left: 10px; }
    .download-btn { background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: 10px; padding: 6px 12px; font-size: 12px; cursor: pointer; transition: all 0.2s; font-family: 'Cairo', sans-serif; white-space: nowrap; }
    .download-btn:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
    .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
    .empty-icon { font-size: 56px; margin-bottom: 16px; opacity: 0.4; }
    footer { text-align: center; padding: 32px 0; color: var(--muted); font-size: 13px; border-top: 1px solid var(--border); margin-top: 20px; }
    @media (max-width: 600px) { .main-card { padding: 20px; } .settings-row { flex-direction: column; } h1 { font-size: 2rem; } }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo-badge"><div class="logo-dot"></div> مدعوم بـ Hugging Face AI</div>
      <h1>مولّد الصور الذكي</h1>
      <p class="subtitle">حوّل أفكارك إلى صور إبداعية بقوة الذكاء الاصطناعي</p>
    </header>

    <div class="main-card">
      <div style="margin-bottom:20px;">
        <label>✏️ وصف الصورة (بالإنجليزية أفضل)</label>
        <textarea id="prompt" placeholder="A beautiful woman in a park, natural lighting, photorealistic..."></textarea>
      </div>

      <div class="suggested">
        <label>💡 أمثلة جاهزة</label>
        <div class="sug-chips">
          <div class="sug-chip" onclick="setPrompt('a young woman smiling in a flower garden, golden hour lighting, photorealistic')">👩 امرأة في الحديقة</div>
          <div class="sug-chip" onclick="setPrompt('futuristic city at night with neon lights and flying cars, cinematic')">🌆 مدينة مستقبلية</div>
          <div class="sug-chip" onclick="setPrompt('majestic lion in african savanna at sunset, wildlife photography')">🦁 أسد في الطبيعة</div>
          <div class="sug-chip" onclick="setPrompt('cozy coffee shop interior with warm lighting, photorealistic')">☕ مقهى دافئ</div>
          <div class="sug-chip" onclick="setPrompt('mountain landscape with snow and aurora borealis, 8k photography')">🏔️ جبال وشفق</div>
        </div>
      </div>

      <div class="settings-row" style="margin-top:20px;">
        <div class="setting-group">
          <label>🤖 النموذج</label>
          <select id="model">
            <option value="realistic">📸 واقعي فوتوغرافي</option>
            <option value="portrait">🧑 بورتريه</option>
            <option value="artistic">🎨 فن رقمي</option>
            <option value="anime">🎌 أنمي</option>
          </select>
        </div>
        <div class="setting-group">
          <label>🔢 عدد الصور</label>
          <select id="count">
            <option value="1">1 صورة</option>
            <option value="2">2 صور</option>
            <option value="4" selected>4 صور</option>
          </select>
        </div>
      </div>

      <div class="error-box" id="errorBox"></div>

      <button class="generate-btn" id="generateBtn" onclick="generateImages()">
        <div class="btn-inner">
          <span id="btnIcon">✨</span>
          <span id="btnText">إنشاء الصور الآن</span>
        </div>
      </button>
    </div>

    <div id="resultsSection" style="margin-bottom:48px;">
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">🎨</div>
        <p>ستظهر صورك الإبداعية هنا</p>
      </div>
      <div class="image-grid" id="imageGrid"></div>
    </div>

    <footer>مولّد الصور بالذكاء الاصطناعي &mdash; Hugging Face AI</footer>
  </div>

  <script>
    function setPrompt(text) { document.getElementById('prompt').value = text; }

    let imageHistory = [];

    async function generateImages() {
      const prompt = document.getElementById('prompt').value.trim();
      const model = document.getElementById('model').value;
      const count = parseInt(document.getElementById('count').value);

      if (!prompt) return showError('⚠️ يرجى إدخال وصف الصورة');
      hideError();
      setLoading(true);

      try {
        const promises = Array.from({ length: count }, () =>
          fetch('/api/generate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ prompt, model })
          }).then(r => r.json()).then(d => {
            if (d.error) throw new Error(d.error);
            return d.image;
          })
        );

        const results = await Promise.allSettled(promises);
        const successful = results.filter(r => r.status === 'fulfilled').map(r => r.value);
        const failed = results.filter(r => r.status === 'rejected').length;

        if (successful.length === 0) throw new Error(results[0]?.reason?.message || 'فشل إنشاء الصور');

        successful.forEach(img => imageHistory.unshift({ src: img, prompt }));
        renderImages();
        if (failed > 0) showError(`✅ تم إنشاء ${successful.length} صورة. فشل ${failed}.`);

      } catch (err) {
        showError('❌ ' + (err.message || 'حدث خطأ'));
      } finally {
        setLoading(false);
      }
    }

    function renderImages() {
      const grid = document.getElementById('imageGrid');
      document.getElementById('emptyState').style.display = 'none';
      grid.innerHTML = '';
      imageHistory.forEach((item, i) => {
        const card = document.createElement('div');
        card.className = 'image-card';
        card.style.animationDelay = `${i * 0.06}s`;
        card.innerHTML = `
          <img src="${item.src}" alt="${item.prompt}" loading="lazy" />
          <div class="image-card-footer">
            <span class="image-prompt-text">${item.prompt}</span>
            <button class="download-btn" onclick="downloadImage('${item.src}', ${i})">⬇ تحميل</button>
          </div>`;
        grid.appendChild(card);
      });
    }

    function downloadImage(src, i) {
      const a = document.createElement('a');
      a.href = src; a.download = `ai-image-${Date.now()}-${i}.jpg`; a.click();
    }

    function setLoading(v) {
      document.getElementById('generateBtn').disabled = v;
      document.getElementById('btnIcon').innerHTML = v ? '<div class="spinner"></div>' : '✨';
      document.getElementById('btnText').textContent = v ? 'جاري الإنشاء... قد يستغرق دقيقة' : 'إنشاء الصور الآن';
    }

    function showError(msg) { const b = document.getElementById('errorBox'); b.textContent = msg; b.style.display = 'block'; }
    function hideError() { document.getElementById('errorBox').style.display = 'none'; }
  </script>
</body>
</html>
